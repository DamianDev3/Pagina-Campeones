<!DOCTYPE html>

<html lang="es">
<head>
  <!-- Enlace de Google Fonts para la tipografía Cinzel y Montserrat -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- El head contiene configuración que NO se ve en la página. -->

  <!-- Permite que se vean correctamente las tildes, la ñ y los símbolos. -->
  <meta charset="UTF-8">

  <!-- Hace que la página se adapte al ancho real del celular. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Texto que aparece en la pestaña del navegador. -->
  <title>Campeones</title>

  <!-- Descripción que usan Google y las redes sociales al compartir el sitio. -->
  <meta name="description" content="Sitio oficial de Campeones.">

  <!-- Carga Tailwind CSS desde internet.
       Es lo que permite usar clases como bg-purple-950, text-5xl o px-4. -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- Carga los estilos propios: el degradado del hero, los dorados,
       el lema verde y el efecto de las columnas. -->
  <link rel="stylesheet" href="assets/css/styles.css">
</head>

<!--
  BODY: todo lo visible de la página.
  - bg-purple-950: color de fondo base de la página (morado oscuro).
  - text-slate-100: color general del texto (casi blanco).
  - antialiased: suaviza las letras.
  - min-h-screen: la página ocupa como mínimo el alto de la pantalla.
-->
<body class="min-h-screen w-full overflow-x-hidden bg-purple-950 text-slate-100 antialiased">


  <header class="sticky top-0 z-50 border-b border-white/10 bg-purple-950/80 backdrop-blur">

    <!-- Contenedor interno: centra el contenido y limita el ancho máximo. -->
    <div class="mx-auto flex h-23 max-w-6xl items-center justify-between px-4">

      <!-- Logo o nombre del sitio. Al hacer clic baja a la sección id="inicio". -->
      <a id="campeonesminiLogo" href="#inicio" class="text-lg font-black uppercase tracking-widest transition hover:text-amber-400 opacity-0 transition-all duration-300 pointer-events-none">
      <img src="assets/img/campeonesLogomini.png" alt="miniCampeones" class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-23">
        
      </a>
  </div>

    <!-- Menú desplegable de celular.
         Empieza oculto con hidden; main.js lo muestra y lo esconde. -->
    <nav
      id="mobile-menu"
      class="hidden border-t border-white/10 bg-purple-950 px-4 py-4 md:hidden"
      aria-label="Navegación móvil"
    >
      <!-- block: cada enlace ocupa toda la fila.
           hover:bg-white/10: fondo claro suave al pasar el mouse. -->
      <a href="#inicio" class="block rounded-lg px-3 py-2 transition hover:bg-white/10">Inicio</a>
      <a href="#sobre" class="block rounded-lg px-3 py-2 transition hover:bg-white/10">Sobre nosotros</a>
      <a href="#contacto" class="block rounded-lg px-3 py-2 transition hover:bg-white/10">Contacto</a>
    </nav>
  </header>

  <!-- ==================== CONTENIDO PRINCIPAL ==================== -->
  <main>


    <section id="inicio" class="hero-bg relative isolate overflow-hidden border-b border-white/10">

      <img
        src="assets/img/columna_romana.png"
        alt=""
        aria-hidden="true"
        class="hero-column pointer-events-none absolute bottom-0 left-0 h-[35%] w-auto select-none sm:h-[40%] sm:opacity-55 lg:h-[70%] lg:opacity-85 xl:left-[2%]"
      >
      <img
        src="assets/img/columna_romana.png"
        alt=""
        aria-hidden="true"
        class="hero-column pointer-events-none absolute bottom-0 right-0 h-[35%] w-auto -scale-x-100 select-none sm:h-[40%] sm:opacity-55 lg:h-[70%] lg:opacity-85 xl:right-[2%]"
      >


      <div class="relative z-10 mx-auto flex min-h-[calc(100svh-6rem)] max-w-4xl flex-col items-center justify-start gap-7 px-4 py-16 text-center sm:gap-9 sm:py-20">

        <!-- ===== LOGO PRINCIPAL =====
             Reemplaza el emblema y el título por la imagen campeonesLogo2.png.
             alt: texto que leen los lectores de pantalla y Google. -->
        <h1 class="w-full max-w-3xl">
          <img
            src="assets/img/campeonesLogo2.png"
            alt="Campeones Squad"
            class="mx-auto w-full drop-shadow-[0_16px_28px_rgba(0,0,0,0.45)]"
          >
        </h1>

        <!-- ===== LEMA =====
             tagline-green: color y brillo definidos en styles.css.
             Cada span con class="block" es una línea del lema. -->
        <p class="tagline-green max-w-2x1 text-lg font-semibold leading-relaxed sm:text-2xl tagline-green max-w-2x1 text-lg font-semibold leading-relaxed sm:text-2xl font-['Cinzel'] text-4xl font-black text-amber-400" >
          <span class="block">Unite al círculo de campeones y</span>
          <span class="block">jugá con nosotros,</span>
          <span class="block">te espera el trato y la experiencia que tanto merecés.</span>
        </p>

     
        <h1 class="tagline-green max-w-2x1 text-lg font-semibold leading-relaxed sm:text-2xl font-['Cinzel'] text-4xl font-black text-amber-400">
          Hace click en el boton de Whatsapp para contactarte con nosotros
        </h1>
        <a href="#sobre">
          <img src="assets/img/whatsappContactar.png" alt="Contactar whatsapp" class="mx-max w-25 position-absolute ">
        </a>
      </div>
    </section>

  
    <section id="sobre" class="border-t border-white/10">
      <div class="flex min-h-[22rem] w-full flex-col items-end justify-end gap-4 px-4 pb-2 pt-8 sm:min-h-[24rem] sm:px-8 sm:pb-3 lg:pr-6">

        <!-- Logo decorativo -->
        <img
          src="assets/img/campeonesLogomini.png"
          alt=""
          aria-hidden="true"
          class="w-20 select-none md:w-39"
        >

        <!-- Columna decorativa -->
        <img
          src="assets/img/columna_romana.png"
          alt=""
          aria-hidden="true"
          class="w-20 select-none md:w-35"
      
        >
    <!--   <p class="mx-auto">&copy; <span id="year"></span> Campeones. Todos los derechos reservados.</p> -->
           
    </section>

  </main>


  <!-- Carga el JavaScript: menú móvil y año del footer. -->
  <script src="assets/js/main.js"></script>
</body>
</html>
