<!DOCTYPE html>

<html lang="es">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&display=swap" rel="stylesheet">

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Campeones</title>

  <meta name="description" content="Sitio oficial de Campeones.">

  <link rel="icon" type="image/png" href="assets/img/campeonesLogomini.png">
  <meta name="theme-color" content="#3b0764">

  <link rel="stylesheet" href="assets/css/tailwind.css">

  <link rel="stylesheet" href="assets/css/styles.css">

  <script defer src="https://cloud.umami.is/script.js" data-website-id="9603c0a6-80e9-4f61-a080-e493b1fedfec"></script>
</head>

<body class="min-h-screen w-full overflow-x-hidden bg-purple-950 text-slate-100 antialiased">

  <header class="sticky top-0 z-50 border-b border-white/10 bg-purple-950/80 backdrop-blur">

    <div class="mx-auto flex h-[5.2rem] max-w-6xl items-center justify-between px-4 sm:h-23">

      <a id="campeonesminiLogo" href="#inicio" class="transition-all duration-300 opacity-0 pointer-events-none">
      <img src="assets/img/campeonesLogomini.png" alt="Campeones Squad" class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-[5.2rem] sm:w-23">

      </a>
  </div>

  </header>

  <main>

    <section id="inicio" class="hero-bg relative isolate overflow-hidden border-b border-white/10 pb-28 sm:pb-0">

      <img
        src="assets/img/columna_romana.png"
        alt=""
        aria-hidden="true"
        class="hero-column pointer-events-none absolute bottom-0 left-0 h-[27%] w-auto select-none sm:hidden xl:block xl:h-[60%] xl:opacity-85 2xl:h-[70%]"
      >
      <img
        src="assets/img/columna_romana.png"
        alt=""
        aria-hidden="true"
        class="hero-column pointer-events-none absolute bottom-0 right-0 h-[27%] w-auto -scale-x-100 select-none sm:hidden xl:block xl:h-[60%] xl:opacity-85 2xl:h-[70%]"
      >

      <div class="relative z-10 mx-auto flex min-h-[calc(100svh-5.2rem)] max-w-4xl flex-col items-center justify-start gap-7 px-4 py-16 text-center sm:min-h-[calc(100svh-6rem)] sm:gap-9 sm:py-20">

        <h1 class="w-full max-w-3xl">
          <img
            src="assets/img/campeonesLogo2.png"
            alt="Campeones Squad"
            class="mx-auto w-full drop-shadow-[0_16px_28px_rgba(0,0,0,0.45)]"
          >
        </h1>

        <p class="tagline-green font-['Cinzel'] text-lg font-semibold leading-relaxed sm:text-2xl">
          <span class="block">Unite al círculo de campeones y</span>
          <span class="block">jugá con nosotros,</span>
          <span class="block">te espera el trato y la experiencia que tanto merecés.</span>
        </p>

        <p class="tagline-green font-['Cinzel'] text-lg font-semibold leading-relaxed sm:text-2xl">
          Hacé clic en el botón de WhatsApp para contactarte con nosotros
        </p>

        <a href="https://youtu.be/dQw4w9WgXcQ?si=_0dKH75WIfa16pEG" target="_blank" rel="noopener noreferrer" aria-label="Contactar por WhatsApp">
          <img src="assets/img/whatsappContactar.png" alt="Contactar por WhatsApp" class="w-25">
        </a>
      </div>
    </section>

    <section class="relative border-t border-white/10">
      <div class="flex min-h-[22rem] w-full flex-col items-end justify-end gap-4 px-4 pb-2 pt-8 sm:min-h-[24rem] sm:px-8 sm:pb-3 lg:px-6">

        <div class="flex w-full flex-col items-end gap-4">
          <div class="relative flex w-full items-center justify-end gap-4">
            <p class="title-3d whitespace-nowrap text-base uppercase leading-none min-[360px]:text-lg min-[420px]:text-xl min-[480px]:text-2xl sm:text-4xl md:text-3xl lg:absolute lg:left-1/2 lg:top-1/2 lg:z-10 lg:-translate-x-1/2 lg:-translate-y-1/2 lg:text-5xl">
              CAMPEONES SQUAD
            </p>

            <img
              src="assets/img/campeonesLogomini.png"
              alt=""
              aria-hidden="true"
              class="block w-20 shrink-0 select-none md:w-35"
            >
          </div>

          <img
            src="assets/img/columna_romana.png"
            alt=""
            aria-hidden="true"
            class="hero-column w-20 select-none md:w-35"
          >
        </div>
      </div>
    </section>

  </main>

  <script src="assets/js/main.js"></script>
</body>
</html>
